name: Update prospect career stats
on:
  schedule:
    - cron: "20 10 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-career
  cancel-in-progress: false
jobs:
  career:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 curl_cffi
      - run: python scripts/career.py
      - name: Commit if changed
        run: |
          git config user.name "prospect-bot"
          git config user.email "bot@users.noreply.github.com"
          git add career.json
          git diff --cached --quiet && exit 0
          git commit -m "Update prospect career stats"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
