name: Update Abby stats
on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/abby.py
      - name: Commit if changed
        run: |
          git config user.name "prospect-bot"
          git config user.email "bot@users.noreply.github.com"
          git add abby.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Abby stats"
          for i in 1 2 3 4 5 6; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 10 + 3))
          done
          exit 1
